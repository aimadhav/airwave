[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-file-ai-layer"
version = "0.1.0"
description = "AI Layer for speech processing: transcription, verification, analysis, and query answering"
readme = "Documentation/AI_Layer/00_AI_Layer_Architecture_Overview.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.0.0",
    "google-genai>=0.1.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
diarization = ["sherpa-onnx==1.13.8", "scipy>=1.14,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
