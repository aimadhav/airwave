# Opt-in backend experiment. Existing project defaults remain unchanged.
dsp:
  random_audio_provider: local_model
  local_model:
    backend: nemo_native
    num_speakers: -1
    native:
      executable: models/nemo-native/nemo-speech-0.2.0-windows-x86_64-cpu/bin/nemo-speech.exe
      model: models/diarization/Nemotron-3-Diarization.q8_0.gguf
      preset: v3-offline
      full_attention: false
      max_full_attention_seconds: 390.0
      timeout_seconds: 600.0
